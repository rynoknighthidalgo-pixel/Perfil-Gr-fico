<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Cotización - Perfil Gráfico</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Si usas Bootstrap en tus otras páginas, puedes mantener esta línea -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="stylecss/style.css">
</head>
<body>
<div class="Container">
   <div class="box1">
       <h1><i class="fa-solid fa-file-pen"></i> Formulario de Cotización</h1>
   </div>
   <div class="box2">
       <nav>
           <ul>
               <li><a href="index.html"><i class="fa-solid fa-house"></i> Inicio</a></li>
               <li><a href="productos.html"><i class="fa-solid fa-box-archive"></i> Productos</a></li>
               <li><a href="servicios.html"><i class="fa-solid fa-gears"></i> Servicios</a></li>
               <li><a href="sobrenosotros.html"><i class="fa-solid fa-users"></i> Sobre nosotros</a></li>
               <li><a href="contacto.html"><i class="fa-solid fa-envelope"></i> Contacto</a></li>
           </ul>
       </nav>
   </div>
   <div class="box3" style="align-items: stretch; text-align: left; padding: 30px;">
       <h2 style="font-family: 'Oswald', sans-serif; color: #324326;" class="mb-3"><i class="fa-solid fa-envelope-open-text"></i> Envíanos los detalles de tu proyecto</h2>
       <p class="text-muted mb-4">Completa el siguiente formulario para solicitar una cotización exacta para tu imprenta o diseño.</p>

       <form action="#" method="POST">
           <div class="mb-3">
               <label for="nombre" class="form-label fw-semibold" style="color: #2b3621;">Nombre Completo</label>
               <input type="text" class="form-control" id="nombre" placeholder="Tu nombre o el de tu empresa" required style="border-color: #324326;">
           </div>
           <div class="mb-3">
               <label for="email" class="form-label fw-semibold" style="color: #2b3621;">Correo Electrónico</label>
               <input type="email" class="form-control" id="email" placeholder="tucorreo@ejemplo.com" required style="border-color: #324326;">
           </div>
           <div class="mb-3">
               <label for="servicio" class="form-label fw-semibold" style="color: #2b3621;">Servicio Requerido</label>
               <select class="form-select" id="servicio" required style="border-color: #324326;">
                   <option value="" selected disabled>Selecciona una opción...</option>
                   <option value="impresion">Impresión Digital / Látex</option>
                   <option value="ctp">Placas CTP y Film</option>
                   <option value="banners">Banners Publicitarios</option>
                   <option value="etiquetas">Fabricación de Etiquetas</option>
                   <option value="otro">Otro diseño gráfico</option>
               </select>
           </div>
           <div class="mb-4">
               <label for="mensaje" class="form-label fw-semibold" style="color: #2b3621;">Detalles del Proyecto</label>
               <textarea class="form-control" id="mensaje" rows="4" placeholder="Medidas, cantidades, tipo de material..." required style="border-color: #324326;"></textarea>
           </div>
           <div class="d-grid">
               <button type="submit" class="btn text-white fw-bold py-2" style="background-color: #4a5d3e; border: 1px solid #324326;"><i class="fa-solid fa-paper-plane me-2"></i>Enviar Solicitud</button>
           </div>
       </form>
   </div>
   <div class="box4">
       <p><i class="fa-regular fa-copyright"></i> Pie de página - Todos los derechos reservados</p>
   </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
